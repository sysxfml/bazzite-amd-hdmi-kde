name: Build Custom Kernel
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Compile Patched Linux Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Create Massive Swap Space (Prevent OOM)
        run: |
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential dwarves flex git libelf-dev libssl-dev libncurses-dev rsync zstd rpm wget cpio kmod

      - name: Clone bleeding-edge kernel tree
        run: |
          git clone --depth 1 https://github.com/torvalds/linux.git linux-src

      - name: Apply HDMI 7.2 Patch
        run: |
          cd linux-src
          wget -O vrr.patch https://github.com/torvalds/linux/compare/master...Lawstorant:linux:hdmi-7.2.patch
          git apply vrr.patch

      - name: Configure Kernel for Bazzite
        run: |
          cd linux-src
          podman pull ghcr.io/ublue-os/bazzite-deck:testing
          podman create --name bazzite_temp ghcr.io/ublue-os/bazzite-deck:testing
          podman cp bazzite_temp:/usr/lib/modules ./bazzite-modules
          podman rm bazzite_temp
          CONFIG_FILE=$(find ./bazzite-modules -maxdepth 2 -name "config" -type f | sort -V | tail -n 1)
          cp "${CONFIG_FILE}" .config
          make olddefconfig
          scripts/config --disable DEBUG_INFO
          scripts/config --disable DEBUG_INFO_BTF
          scripts/config --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          scripts/config --enable DEBUG_INFO_NONE
          scripts/config --disable MODULE_SIG
          scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str SYSTEM_REVOCATION_KEYS ""
          make olddefconfig

      - name: Compile RPM packages
        run: |
          cd linux-src
          if ! make -j$(nproc) binrpm-pkg INSTALL_MOD_STRIP=1 > build.log 2>&1
          then
            echo "=== FATAL COMPILATION ERROR ==="
            tail -n 200 build.log
            exit 1
          fi

      - name: Clean up old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          gh release delete latest-kernel --repo ${{ github.repository }} --yes
          gh tag delete latest-kernel --repo ${{ github.repository }} --yes

      - name: Gather compiled RPMs
        run: |
          mkdir -p final-rpms
          find /home/runner/rpmbuild -name "*.rpm" -type f -exec cp -t final-rpms/ {} + || true
          find ./linux-src -name "*.rpm" -type f -exec cp -t final-rpms/ {} + || true
          rm -f final-rpms/*debuginfo*.rpm
          rm -f final-rpms/*debugsource*.rpm
          ls -lh final-rpms/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-kernel
          name: "Next-Gen Patched Kernel"
          files: final-rpms/*.rpm
