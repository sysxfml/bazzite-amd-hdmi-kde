name: Build Custom OGC+FRL Kernel
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Compile Patched OGC Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Massive Swap Space (Prevent OOM)
        run: |
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Extract OGC SRPM from Bazzite testing image
        run: |
          mkdir -p srpms
          echo "Extracting SRPM from ghcr.io/ublue-os/bazzite-deck:testing..."
          sudo podman run --rm -v $(pwd)/srpms:/output ghcr.io/ublue-os/bazzite-deck:testing bash -c "dnf5 install -y dnf-plugins-core && dnf5 download --source kernel --destdir /output"
          ls -lh srpms/

      - name: Patch and Compile SRPM in Fedora Container
        run: |
          mkdir -p final-rpms
          sudo podman run --rm -v ${{ github.workspace }}:/work -w /work registry.fedoraproject.org/fedora:44 bash -c "
            set -e
            set -o pipefail
            
            echo 'Installing build dependencies...'
            dnf install -y rpmdevtools rpm-build yum-utils bc bison flex elfutils-libelf-devel openssl-devel gcc gcc-c++ make zstd dwarves wget curl
            
            echo 'Setting up rpmbuild tree...'
            rpmdev-setuptree
            rpm -Uvh /work/srpms/kernel-*.src.rpm
            
            echo 'Downloading FRL Patch (with Fallback)...'
            # 首选方案：尝试拉取 Bazzite 社区常用的稳定版 FRL 补丁
            if ! wget -O ~/rpmbuild/SOURCES/frl.patch https://raw.githubusercontent.com/ublue-os/bazzite/main/spec_files/kernel/patches/0001-drm-amd-display-Add-FRL-support.patch
            then
               echo 'Primary URL failed, attempting fallback...'
               # 备选方案：通过 GitHub API 从 Lawstorant 的对比树中强行抓取包含 FRL 的 diff，并作为 patch
               wget -O ~/rpmbuild/SOURCES/frl.patch https://github.com/torvalds/linux/compare/master...Lawstorant:linux:hdmi-7.2.patch
            fi
            
            # 检查下载的文件是否为空或是否包含 HTML 错误页
            if [ ! -s ~/rpmbuild/SOURCES/frl.patch ] || grep -qi '<html' ~/rpmbuild/SOURCES/frl.patch
            then
              echo '=== FATAL: FAILED TO DOWNLOAD A VALID FRL PATCH ==='
              exit 1
            fi
            
            echo 'Valid FRL patch downloaded successfully.'
            
            echo 'Modifying SPEC file...'
            cd ~/rpmbuild/SPECS/
            sed -i '/^Name:.*/a Patch9999: frl.patch' kernel.spec
            sed -i 's/%define buildid .*/%define buildid .frl1/' kernel.spec
            
            echo 'Installing SRPM dependencies...'
            dnf builddep -y kernel.spec
            
            echo 'Building binary RPMs...'
            if ! rpmbuild -bb kernel.spec
            then
              echo '=== RPMBUILD FAILED ==='
              exit 1
            fi
            
            echo 'Copying finished RPMs to workspace...'
            find ~/rpmbuild/RPMS/ -name '*.rpm' -exec cp {} /work/final-rpms/ +
          "
          rm -f final-rpms/*debuginfo*.rpm || true
          rm -f final-rpms/*debugsource*.rpm || true
          ls -lh final-rpms/

      - name: Clean up old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          gh release delete latest-kernel --repo ${{ github.repository }} --yes
          gh tag delete latest-kernel --repo ${{ github.repository }} --yes

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-kernel
          name: "Bazzite OGC Kernel + FRL"
          files: final-rpms/*.rpm
